<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Life Quest — 生活RPG</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient"></div>
  <main id="app" class="app"></main>
  <nav class="tabs" aria-label="メインメニュー">
    <button data-tab="home" class="active"><span>⌂</span>ホーム</button>
    <button data-tab="record"><span>✦</span>記録</button>
    <button data-tab="status"><span>⌁</span>ステータス</button>
    <button data-tab="achievements"><span>♜</span>実績</button>
    <button data-tab="menu"><span>⚙</span>メニュー</button>
  </nav>
  <div id="modalRoot"></div>
  <div id="toastRoot" aria-live="polite"></div>
  <input id="importFile" type="file" accept="application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
